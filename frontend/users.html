<form class="message-form" id="messageForm">

    <input
        type="file"
        id="mediaInput"
        accept="image/*,video/*,audio/*,.pdf,.doc,.docx"
        hidden
    />

    <!-- Selected media preview -->
    <div id="mediaPreview" class="media-preview" style="display: none;">
        <img id="previewImage" alt="Selected image preview">
        <span id="previewFileName"></span>
        <button type="button" id="removeMediaBtn">×</button>
    </div>

    <!-- Message input row -->
    <div class="message-input-row">
        <button
            type="button"
            id="attachMediaBtn"
            class="attach-media-btn"
            title="Attach media"
        >📎</button>

        <input
            type="text"
            id="messageInput"
            placeholder="Type a message"
        >

        <button type="submit">➤</button>
    </div>

</form>


        </main>
